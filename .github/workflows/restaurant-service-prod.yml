name: System Delivery Restaurants Service

on:
  push:
    branches:
      - main
    paths:
      - 'restaurants-service/**'
      - '.github/workflows/restaurant-service-prod.yml'

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./restaurants-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'

      - name: Build project
        run: mvn clean install

      - name: Login docker
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        working-directory: .

      - name: Build docker image
        run: docker build -t caiquepirs/restaurants-service .

      - name: Publish image
        run: docker push caiquepirs/restaurants-service

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create file .env
        run: |
          echo "${{ secrets.DOCKER_ENV_FILE }}" > .env

      - name: Pull docker image
        run: docker pull caiquepirs/restaurants-service

      - name: Run docker container
        run: |
          docker compose up -d --no-deps restaurants-service
          docker image prune -f