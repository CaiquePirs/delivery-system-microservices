name: System Delivery Payments Service

on:
  push:
    branches:
      - main
    paths:
      - 'payments-service/**'
      - '.github/workflows/payments-service-prod.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
        ports:
          - ${{ secrets.PAYMENTS_MONGODB_PORT }}:${{ secrets.PAYMENTS_MONGODB_PORT }}

    defaults:
      run:
        working-directory: ./payments-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'

      - name: Build project
        run: mvn clean install
        env:
          PAYMENTS_MONGO_USERNAME: "${{ secrets.MONGODB_USERNAME }}"
          PAYMENTS_MONGO_PASSWORD: "${{ secrets.MONGODB_PASSWORD }}"
          PAYMENTS_MONGO_HOST: mongodb
          PAYMENTS_MONGO_DB: payments
          PAYMENTS_MONGO_PORT: "${{ secrets.PAYMENTS_MONGODB_PORT }}"

      - name: Login docker
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        working-directory: .

      - name: Build docker image
        run: docker build -t caiquepirs/payments-service .

      - name: Publish image
        run: docker push caiquepirs/payments-service