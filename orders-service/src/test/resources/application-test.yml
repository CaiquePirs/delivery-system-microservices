spring:
  application:
    name: orders-service

  data:
    mongodb:
      uri: mongodb://admin:admin123@localhost:27017/orders?authSource=admin

  rabbitmq:
    host: localhost
    port: 5672
    username: test
    password: test
    exchange-verify-payment: orders-verify-payment-exchange
    exchange-approved-payment: orders-approved-payment-exchange
    delivery-ready-update: orders-delivery-ready-queue
    listener:
      simple:
        auto-startup: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost/mock-jwk

  output:
    ansi:
      enabled: ALWAYS

logging:
  pattern:
    console: "%clr(%d{dd-MM-yyyy HH:mm:ss}){faint} %clr(%5p) %clr([%t]){faint} %clr(%-40.40logger){cyan} %clr(:){yellow} %m%n"

server:
  port: 0

eureka:
  client:
    enabled: false
