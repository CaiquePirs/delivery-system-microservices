name: System Delivery Authentication Service

on:
  push:
    branches:
      - main
    paths:
      - 'authentication-service/**'
      - '.github/workflows/auth-service-prod.yml'

jobs:
    build:
      runs-on: self-hosted
      defaults:
        run:
          working-directory: ./authentication-service
      steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Setup java
          uses: actions/setup-java@v3
          with:
            distribution: temurin
            java-version: '21'
            cache: 'maven'

        - name: Build project
          run: mvn clean install

        - name: Login docker
          run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          working-directory: .

        - name: Build docker image
          run: docker build -t caiquepirs/authentication-service .

        - name: Publish image
          run: docker push caiquepirs/authentication-service

    deploy:
      needs: build
      runs-on: self-hosted
      steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Create .env file
          run: | 
            echo "${{ secrets.DOCKER_ENV_FILE }}" > .env

        - name: Pull image docker
          run: docker pull caiquepirs/authentication-service

        - name: Run docker compose
          run: |
              docker compose up -d --no-deps authentication-service
              docker image prune -f
