name: System Delivery Authentication Service

on:
  push:
    branches:
      - main

jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Setup java
          uses: actions/setup-java@v3
          with:
            distribution: temurin
            java-version: '17'

        - name: Build project
          run: mvn clean install

        - name: Login docker
          run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}

        - name: Build docker image
          run: docker build -t caiquepirs/authentication-service .

        - name: Publish image
          run: docker push caiquepirs/authentication-service