spring:
  application:
    name: deliveries-service

  datasource:
    url: jdbc:postgresql://localhost:5434/delivery_db
    username: admin
    password: admin123

  rabbitmq:
    port: 5672
    host: localhost
    username: admin
    password: admin123
    subscribe-payment-queue: payment-approved-delivery-queue
    publisher-delivery-ready: delivery-ready-fanout

  output:
    ansi:
      enabled: ALWAYS

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

logging:
  pattern:
    console: "%clr(%d{dd-MM-yyyy HH:mm:ss}){faint} %clr(%5p) %clr([%t]){faint} %clr(%-40.40logger){cyan} %clr(:){yellow} %m%n"

server:
  port: 8087

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
     instance-id: ${spring.application.name}:${server.port}
