name: System Delivery Eureka Service

on:
  push:
      branches:
        - main
      paths:
        - 'infrastructure-service/eureka/**'
        - '.github/workflows/eureka-service-prod.yml'

jobs:
    build:
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: ./infrastructure-service/eureka
      steps:
        - name: Checkout Code
          uses: actions/checkout@v3

        - name: Setup Java
          uses: actions/setup-java@v3
          with:
            distribution: temurin
            java-version: '21'
            cache: 'maven'

        - name: Build project
          run: mvn clean install

        - name: Login docker
          run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          working-directory: .

        - name: Build docker image
          run: docker build -t caiquepirs/eureka-service .

        - name: Publish image
          run: docker push caiquepirs/eureka-service