spring:
  application:
    name: payments-service

  data:
    mongodb:
      uri: mongodb://admin:admin123@localhost:27018/payments?authSource=admin

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost/mock-jwk

  rabbitmq:
    host: localhost
    port: 5672
    username: test
    password: test
    listener:
      simple:
        auto-startup: false
    subscriber:
      payment-queue: test-payment-queue
    publisher:
      payment-exchange: test-payment-exchange

  output:
    ansi:
      enabled: ALWAYS

logging:
  pattern:
    console: "%clr(%d{dd-MM-yyyy HH:mm:ss}){faint} %clr(%5p) %clr([%t]){faint} %clr(%-40.40logger){cyan} %clr(:){yellow} %m%n"

server:
  port: 0

eureka:
  client:
    enabled: false
