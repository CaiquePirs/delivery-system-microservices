name: Notification Service CI/CD Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'notification-service/**'
      - '.github/workflows/notification-service-prod.yml'

jobs:
  build:
    runs-on: ubuntu:latest
    defaults:
      run:
        working-directory: ./notification-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'

      - name: Build project
        run: mvn clean install

      - name: Login docker
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        working-directory: .

      - name: Build docker image
        run: docker build -t caiquepirs/notification-service .

      - name: Publish image
        run: docker push caiquepirs/notification-service

  deploy:
    needs: build
    runs-on: ubuntu:latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v3

      - name: Create file .env
        run: |
          echo "${{ secrets.DOCKER_ENV_FILE }}" > .env

      - name: Docker pull image
        run: docker pull caiquepirs/notification-service

      - name: Run docker compose
        run: |
          docker compose up -d --no-deps notification-service
          docker image prune -f